35：属灵同伴、属灵父母儿女、五重职事团队。\n\n【社交生活的回应原则】\n1. 先听、再回应；先同理，再引向神的观点。不说教、不定罪。\n2. 冲突时：先帮助对方看自己的部分（太7:3-5），再照太5:23-24、太18:15的方式私下、温柔地沟通；不鼓励背后议论或在群组公开指责。\n3. 安全优先：若涉及家暴、性骚扰或侵犯、跟踪、诈骗、勒索、霸凌、威胁或犯罪，明确告诉对方不必独自面对、不需要先私下去说，应先确保安全，寻求可信任的人、专业协助，必要时报警。不要用「饶恕」「和睦」「忍耐」叫人沉默或留在危险中。饶恕不等于立刻恢复信任。\n4. 接待与交友要有智慧：提醒与异性单独相处、深夜、陌生网友、借贷金钱的界线。\n5. 传福音不施压、不把人当业绩；友谊本身就有价值。\n6. 不谈论政党立场；不论断特定宗派或人物。\n7. 遇到孤独、社交焦虑、忧郁、自我伤害念头、医疗或法律问题，温柔关心，不下诊断；鼓励寻求辅导、医疗等专业协助与信任的人；若有立即危险，请他立刻联络当地紧急求助电话。\n\n【风格】一律用简体中文。引用圣经用和合本，只在有把握时引用，绝不杜撰经文或出处。深入浅出、善用比喻、温暖有盼望，回答精简（通常两三段）。回答会被朗读：不用表格、不用 Markdown 符号，经文章节写成可朗读的形式（如「约翰福音十三章三十四节」）。结尾可给一个今天就能对一个真实的人做的小行动。","tab_grow":"操练","t_920":"920 图谱","t_920_d":"为身边的人代祷关心","t_words":"言语守望","t_words_d":"每晚三问省察言语","t_five":"五个名字","t_five_d":"福音友谊名单","path_quiet":"安静的光","path_quiet_d":"6周・给内向、怕开口的人：从聆听与祷告开始的小步社交。","path_digital":"数位原住民","path_digital_d":"8周・给青年：社群媒体、比较心与线上见证。","path_stranger":"异乡人","path_stranger_d":"6周・给刚到新城市或在海外工作留学的人：找到属灵的家，也成为接待人的人。","path_recon":"和好之路","path_recon_d":"6周・给正经历关系破裂的人：饶恕、道歉、界线与和好。慢慢来，主与你同在。","path_senior":"乐龄同行","path_senior_d":"8周・给退休长者：从失落的人脉，到成为属灵父母、陪伴下一代。","path_leader":"小组长带领版","path_leader_d":"12周・每单元精选一周，给小组长带小组走完核心内容。","seg_five":"五个名字","seg_host":"接待","seg_words":"言语守望","seg_digi":"数位安息","c_friend":"朋友","c_nb":"邻居","c_work":"同事同学","c_seek":"还没信主的朋友","lg_love":"爱的行动","lg_host":"接待","tableNote":"每完成一周，长桌旁就多一盏灯；点座位可看那一周。","statPeople":"关系图谱","statWords":"言语守望","fiveIntroT":"五个名字","fiveAdd":"加入名字","fiveFull":"已经有五个名字了；可以先为他们祷告。","fiveToday":"今天为他祷告","fivePrayed":"我为他祷告了","fiveLove":"爱的行动","fiveStep":"友谊旅程","fivePrays":"可以这样为他祷告","fiveNone":"写下第一个名字，开始为他祷告。","loggedLove":"已记下：一个爱的行动","fiveJourney":"福音友谊的六步旅程","prayedN":"祷告 {0} 次","hostTitle":"接待计划","hostWho":"要接待谁？","hostWhen":"日期","hostWhat":"准备做什么（例：一起吃面）","hostAdd":"加入计划","hostDoneBtn":"完成了","hostTips":"接待心法","hostIce":"破冰问题","hostDraw":"抽一题","hostNone":"还没有计划。这个月邀请一个人吃顿便饭吧。","hostPlans":"我的接待计划","hostDoneList":"已完成的接待","wwTitle":"言语守望","wwIntro":"每晚花一分钟，用三个问题省察今天的言语。21天为一个操练周期。「耶和华啊，求你禁止我的口，把守我的嘴！」（诗1 ","lvlName1":"Learner of Love","lvlName1_d":"Turning from self-centered socializing to selfless love","lvlName2":"Friend","lvlName2_d":"Filled with God’s love, bearing the Spirit’s fruit","lvlName3":"Good Neighbor","lvlName3_d":"Words, phone, and boundaries under Jesus’ reign","lvlName4":"Peacemaker","lvlName4_d":"Welcoming first, reconciling bravely","lvlName5":"Ambassador of Reconciliation","lvlName5_d":"Salt and light, building God’s network of relationships","xzSys":"You are \"Xiaozhi,\" the companion inside the 321 Social Life app, part of the Kingdom 321 Air Fellowship and 321 Seminary. You are like a humble, warm friend full of faith, hope, and love, helping the user live out Christ among friends, family, neighbors, coworkers, online, and in society—moving from self-centered socializing to selfless love, as an ambassador of reconciliation.\n\n[Boundaries] You are not the Holy Spirit and cannot take God's place. You never replace real pastors, counselors, spiritual parents, spiritual companions, or the church. Always point people to Jesus, Scripture, prayer, and the Spirit's leading, and encourage them back into real face-to-face relationships.\n\n[The 321 Vision] Three foundations: Jesus is my example; the Bible is my standard; the Holy Spirit is my guide. Two cores: let Jesus reign; let Jesus receive all the glory. One purpose: build God's system. Self-centeredness is the root problem; pride is leaving our proper place and grasping power; humility is laying down power and returning to our place. Pride provokes pride and both lose; humility draws out humility and both win. People matter more than tasks; relationships more than things. 920: everyone I relate to is my \"2\"; practice the selfless \"0\"; bear the nine-fold fruit \"9\". 235: spiritual companions, spiritual parents and children, five-fold ministry teams.\n\n[Principles]\n1. Listen first; empathize, then point to God's perspective. No lecturing or condemning.\n2. In conflict: first help them see their own part (Matthew 7:3-5), then approach privately and gently as in Matthew 5:23-24 and 18:15. Do not encourage gossip or public accusations in group chats.\n3. Safety first: if there is domestic abuse, sexual harassment or assault, stalking, fraud, extortion, bullying, threats, or crime, say clearly that they do not have to face it alone or go privately first; they should get safe, seek trusted people and professional help, and contact the police when needed. Never use \"forgiveness,\" \"peace,\" or \"patience\" to silence anyone or keep them in danger. Forgiveness is not the same as immediately restoring trust.\n4. Hospitality and friendship need wisdom: remind them of boundaries around being alone with the opposite sex, late nights, meeting strangers from online, and lending money.\n5. No pressure in sharing the gospel; no one is a project. Friendship has value in itself.\n6. Do not take political party positions; do not judge specific denominations or people.\n7. For loneliness, social anxiety, depression, thoughts of self-harm, medical or legal issues, respond with care and do not diagnose; encourage counseling, medical help, and trusted people; if there is immediate danger, urge them to call local emergency services right away.\n\n[Style] Always answer in English. Quote the World English Bible only when sure; never invent verses or references. Be clear, use simple word pictures, warm and hopeful, concise (usually two or three short paragraphs). Answers may be read aloud: no tables, no Markdown symbols. You may end with one small action they can take today toward a real person.","tab_grow":"Practice","t_920":"920 Map","t_920_d":"Pray for and care for people","t_words":"Word Watch","t_words_d":"Three questions each night","t_five":"Five Names","t_five_d":"Gospel friendship list","path_quiet":"A Quiet Light","path_quiet_d":"6 weeks · for introverts and the shy: small social steps that begin with listening and prayer.","path_digital":"Digital Natives","path_dig var W1 = {"w":1,"title":"三一神：關係的源頭","key":"約17:21","theme":"社交的源頭不是技巧，而是三一神；我們從愛裡被造，也為愛而活。","group":["讀約17:20-23，耶穌為門徒的關係求了甚麼？祂把甚麼當作榜樣？","你過去認為「社交」是為了甚麼？這週你對關係的看法有甚麼改變？","這週你想主動去愛哪一個人？說出一個具體的行動，請組員為你代禱。"],"sunday":"邀請一位許久沒聯絡的朋友或鄰居一起喝杯茶、吃頓簡單的飯。出門前先禱告：「主啊，讓我今天像祢一樣，先去愛。」聚會時多問、多聽，少談自己。回家後為對方寫下一句代禱，感謝神讓你們在相交中嚐到祂的愛。","lessons":[{"d":1,"step":"資訊・啟示","title":"在我們裡面合而為一","ref":"約17:20-26","hear":"耶穌被賣的那一夜，在走向十字架之前，祂為門徒、也為後來每一個信祂的人禱告。祂求的不是成功、不是平安無事，而是關係：「使他們都合而為一。正如你父在我裏面，我在你裏面，使他們也在我們裏面」（約17:21）。\n\n請留意耶穌用來比較的榜樣：不是一間和睦的家庭，也不是一支默契十足的球隊，而是父與子之間的關係。耶穌又說：「因為創立世界以前，你已經愛我了。」（約17:24）在還沒有星辰、沒有人類以前，宇宙最深的實存就已經是一份愛：父愛子，子回應父，聖靈在其中流通。神不是孤單地坐在寶座上，等著有人來陪祂；祂本身就是一個永恆的愛的團契。\n\n這改變了我們看「社交」的眼光。世界說，社交是一種技巧，是建立人脈、讓自己更吃得開的能力。但聖經說，關係的源頭在神裡面。人與人之間每一份真誠的相愛，都是三一神那份愛的回聲。就像一首樂曲，作曲者心中先有了旋律，樂團才奏得出來；神心中先有愛的團契，我們才有能力彼此相愛。\n\n所以，學習社交生活，不是先學說話的技巧，而是先回到源頭。求聖靈打開我們的眼睛，看見自己被邀請進入父、子、聖靈的愛裡；當我們在這份愛裡，與人的關係就有了根。","light":"關係的次序是：先與神，再與自己，再與人，再與事。社交生活的第一步不是「我要認識誰」，而是「我在誰的愛裡」。從人的觀點到神的觀點：關係不是工具，而是神本性的反映。讓耶穌作王，就從讓祂的愛成為我一切關係的源頭開始。","think":["約17:21-23中，耶穌把門徒的合一和甚麼相比？","我在人際中，常把關係當成需要經營的工具，還是愛的流露？","今天我可以怎樣讓一段關係反映出神的愛？"],"speak":"天父，謝謝祢在創立世界以前就與子在愛中相交，又邀請我進入這份愛。赦免我常把關係當成技巧和工具。求聖靈使我先住在祢的愛裡，再從這份愛去愛身邊的人，叫人從我們的相愛中認識祢。奉主耶穌的名禱告，阿們。","do":"今天把約17:21抄在手機備忘錄裡。晚上睡前，想一位你身邊的人，為他禱告一分鐘，求神讓你們的關係反映出祂的愛。","quick":"在宇宙最深處的，不是孤單，而是父、子、聖靈的愛。","rl":"約翰福音 17:20-26","text":[[17,20,"「我不但為這些人祈求，也為那些因他們的話信我的人祈求，"],[17,21,"使他們都合而為一。正如你父在我裏面，我在你裏面，使他們也在我們裏面，叫世人可以信你差了我來。"],[17,22,"你所賜給我的榮耀，我已賜給他們，使他們合而為一，像我們合而為一。"],[17,23,"我在他們裏面，你在我裏面，使他們完完全全地合而為一，叫世人知道你差了我來，也知道你愛他們如同愛我一樣。"],[17,24,"父啊，我在哪裏，願你所賜給我的人也同我在那裏，叫他們看見你所賜給我的榮耀；因為創立世界以前，你已經愛我了。"],[17,25,"公義的父啊，世人未曾認識你，我卻認識你；這些人也知道你差了我來。"],[17,26,"我已將你的名指示他們，還要指示他們，使你所愛我的愛在他們裏面，我也在他們裏面。」"]]},{"d":2,"step":"信服","title":"按神形像造的關係人","ref":"創1:26-28","hear":"一位在科技公司工作的年輕弟兄說，他的生活很有效率：上班對電腦，下班對手機，週末一個人追劇。「人際關係太麻煩了，」他說，「我一個人也過得很好。」直到有一次他重感冒，躺在租來的小房間裡三天，手機裡幾百個聯絡人，卻想不出可以請誰幫他買一碗粥。\n\n我們常有一個舊觀念：人基本上是獨立的個體，關係是加分題，有空才經營，沒空就算了。但神的觀點很不同。創世記說：「我們要照著我們的形像、按著我們的樣式造人」（創1:26）。請注意神說的是「我們」。許多教父讀到這裡，都看見三一神的影子：一位在愛中彼此相交的神，照著自己的樣式造人。接著經文說：「神就照著自己的形像造人，乃是照著他的形像造男造女。」（創1:27）人一被造，就是複數的，就是在關係中的。\n\n這意思是，關係不是人生的附加品，而是我們被造的本相。就像魚為水而造，鳥為天空而造，人是為愛與被愛而造的。一個人把自己關起來，不是「比較自由」，而是離開了被造的本位，就像把魚放在乾地上，看似安靜，其實正在缺氧。\n\n那位弟兄病好之後，開始參加教會的小組。他不太會說話，就負責帶飲料。半年後他說：「原來我不是不需要人，我只是以為不需要。」這正是神的恩典：祂按著自己的形像造我們，也一步步帶我們回到關係裡。","light":"從人的觀點到神的觀點：人不只是「有」關係，人「是」為關係而造。有己的生命想要獨立、自足、作自己的王；無己的生命承認：我需要神，也需要人。回到本位，就是回到神照著祂形像所設計的關係中。","think":["創1:26-27中，「我們」和「造男造女」顯明甚麼？","我是否也曾以為「一個人過得很好」，不需要別人？","這週我可以向誰承認「我需要你」，讓關係更真實？"],"speak":"天父，謝謝祢照著祢的形像造我，使我能愛、也能被愛。我承認有時把自己關起來，以為不需要任何人。求祢醫治我心裡的防衛，帶我回到祢所設計的關係裡，也讓我成為別人可以依靠的人。奉主耶穌的名禱告，阿們。","do":"今天傳一則訊息給一位你平常很少主動聯絡的人（家人、舊同學或同事），具體謝謝他曾經幫過你的一件事。","quick":"人不只是有關係，人是為關係而造。","rl":"創世記 1:26-28","text":[[1,26,"神說：「我們要照著我們的形像、按著我們的樣式造人，使他們管理海裏的魚、空中的鳥、地上的牲畜，和全地，並地上所爬的一切昆蟲。」"],[1,27,"神就照著自己的形像造人，乃是照著他的形像造男造女。"],[1,28,"神就賜福給他們，又對他們說：「要生養眾多，遍滿地面，治理這地，也要管理海裏的魚、空中的鳥，和地上各樣行動的活物。」"]]},{"d":3,"step":"實踐","title":"愛是從神來的","ref":"約壹4:7-12","hear":"約翰寫這封信時，已經是一位年老的使徒。據說他晚年被人抬到聚會中，只反覆說一句話：「小子們，要彼此相愛。」無論這傳說是否完全準確，約翰書信的確把愛說得極其簡單，也極其深刻：「沒有愛心的，就不認識神，因為神就是愛。」（約壹4:8）\n\n約翰沒有說「神有愛」，而是說「神就是愛」。愛不是神的其中一個嗜好，而是祂的本性。而這份愛不是停在理論裡，它有行動：「神差他獨生子到世間來，使我們藉著他得生」（約壹4:9）。三一神的愛向外流出，流到十字架上，也流到我們心裡。\n\n接著約翰說了一句讓人驚訝的話：「從來沒有人見過神，我們若彼此相愛，神就住在我們裏面」（約壹4:12）。世人看不見神，但他們看得見一個基督徒怎樣對待鄰居、怎樣回覆群組的訊息、怎樣對待餐廳裡忙碌的服務生。我們的相愛，成了看不見之神的「看得見的樣子」。\n\n所以今天的操練很簡單：讓神的愛通過你，流到一個真實的人身上。不必轟轟烈烈，像水管一樣就好——水管不必自己製造水，只要通暢、不堵塞。也許是對總是幫大家訂便當的同事說聲謝謝，也許是陪社區裡獨居的長輩聊十分鐘，也許是在群組裡為一位被冷落的人回一句溫暖的話。愛是從神來的，你只要讓它流出去。","light":"用心靠聖靈，不要用腦靠自己。愛不是靠意志擠出來的，而是從神裡面流出來的。920的「2」就是每一個與我有關係的人；今天選一個「2」，讓基督的生命藉著你流向他。水管不必驕傲，也不必自卑；它只要通暢，水自然會流到該去的地方。","think":["約壹4:9-10中，神的愛是怎樣顯明出來的？","我的愛比較像水庫（只存不流），還是像水管？","今天我要讓神的愛流向誰？用甚麼方式？"],"speak":"天父，祢就是愛，祢差祢的獨生子來，使我得生。求祢讓我成為一條通暢的水管，不堵塞、不保留，今天把祢的愛帶給一個真實的人。使人藉著我們的彼此相愛，看見祢的樣子。奉主耶穌的名禱告，阿們。","do":"今天中午以前，想好一位對象：一位常被忽略的同事、鄰居或長輩。今天之內主動問候他，並為他做一件小事，例如幫忙、陪伴或送一杯飲料。","quick":"世人看不見神，卻看得見我們怎樣彼此相愛。","rl":"約翰一書 4:7-12","text":[[4,7,"親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的。凡有愛心的，都是由神而生，並且認識神。"],[4,8,"沒有愛心的，就不認識神，因為神就是愛。"],[4,9,"神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了。"],[4,10,"不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。"],[4,11,"親愛的弟兄啊，神既是這樣愛我們，我們也當彼此相愛。"],[4,12,"從來沒有人見過神，我們若彼此相愛，神就住在我們裏面，愛他的心在我們裏面得以完全了。"]]},{"d":4,"step":"檢討・修正","title":"巴別塔式的社交","ref":"創11:1-9","hear":"人類歷史上第一個大型「團隊合作」，是巴別塔。他們有共同的語言、共同的目標、共同的技術，看起來非常合一。但他們說：「我們要建造一座城和一座塔，塔頂通天，為要傳揚我們的名」（創11:4）。他們的合一不是為了神，而是為了自己的名；不是彼此成全，而是彼此利用，好讓自己被看見。\n\n結果神變亂了他們的口音，他們彼此聽不懂，就分散了。以自己為中心的連結，表面上很緊密，裡面其實很脆弱。今天許多社交圈也像巴別塔：大家聚在一起，是因為彼此有用；一旦沒有利益，就散了。\n\n請用這段經文照照自己。我參加聚會、加入群組、維持某些關係，是為了愛，還是為了「傳揚我的名」？我會不會只跟對我有幫助的人來往？我在別人面前，是在建造他們，還是在建造自己的塔？這些問題不是為了定罪，而是讓聖靈指出有己的地方。\n\n好消息是，故事沒有停在巴別。到了五旬節，聖靈降臨，各國的人都聽見門徒用自己的鄉談說話（參 徒2:6）。巴別塔因有己而分散，五旬節因聖靈而合一。修正的道路不是更努力經營人脈，而是放下自己的塔，讓聖靈把我們重新連在一起。今天向神承認一個你在關係裡「為自己建塔」的地方，把它交給祂。","light":"有己是人類墮落的根源，也是一切關係破口的根。巴別塔要「傳揚我們的名」，三一神的團契卻是彼此榮耀。讓耶穌得著一切的榮耀，我們的關係就不再是為自己建塔，而是一同建立屬神的體系。拆下自己的塔，不是失去，而是得著真正的同伴。","think":["創11:4中，人建塔的動機是甚麼？","我有哪一段關係，其實是在為自己「建塔」？","我要怎樣把這段關係的動機重新交給神？"],"speak":"主耶穌，我承認我常在人群中為自己建塔，想被看見、被肯定，只和對我有用的人來往。求祢赦免我，拆毀我心裡的巴別塔。求聖靈使我的關係不再為了我的名，而是為了祢的名。奉主耶穌的名禱告，阿們。","do":"今天想一位你因為「沒甚麼用」而疏遠的人，例如退休的前輩或不善交際的同學，主動傳一句問候給他，不帶任何目的。","quick":"以自己為中心的連結，看似緊密，其實脆弱。","rl":"創世記 11:1-9","text":[[11,1,"那時，天下人的口音、言語都是一樣。"],[11,2,"他們往東邊遷移的時候，在示拿地遇見一片平原，就住在那裏。"],[11,3,"他們彼此商量說：「來吧！我們要做磚，把磚燒透了。」他們就拿磚當石頭，又拿石漆當灰泥。"],[11,4,"他們說：「來吧！我們要建造一座城和一座塔，塔頂通天，為要傳揚我們的名，免得我們分散在全地上。」"],[11,5,"耶和華降臨，要看看世人所建造的城和塔。"],[11,6,"耶和華說：「看哪，他們成為一樣的人民，都是一樣的言語，如今既做起這事來，以後他們所要做的事就沒有不成就的了。"],[11,7,"我們下去，在那裏變亂他們的口音，使他們的言語彼此不通。」"],[11,8,"於是耶和華使他們從那裏分散在全地上；他們就停工，不造那城了。"],[11,9,"因為耶和華在那裏變亂天下人的言語，使眾人分散在全地上，所以那城名叫巴別。"]]},{"d":5,"step":"反覆・繁殖","title":"保守合而為一的心","ref":"弗4:1-6","hear":"這一週，我們回到了關係的源頭。我們看見耶穌為門徒禱告，求他們像父與子一樣合一；我們看見人是照著神的形像、在關係中被造的；我們學習讓神的愛像水一樣流過我們；也照見了自己心裡的巴別塔。現在，我們要把這份領受鞏固下來，並且傳出去。\n\n保羅在以弗所書提醒教會：「用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。」（弗4:3）請留意，合一是「聖靈所賜」的，不是我們製造的；但我們要「竭力保守」。就像神給我們一座花園，花是祂種的，但除草、澆水是我們的責任。接著保羅說：「一神，就是眾人的父，超乎眾人之上，貫乎眾人之中，也住在眾人之內。」（弗4:6）三一神不只是我們關係的榜樣，祂也住在我們中間，親自把我們連在一起。\n\n怎樣保守呢？保羅給了一份清單：「凡事謙虛、溫柔、忍耐，用愛心互相寬容」（弗4:2）。這些都不是高深的技巧，而是有己死去、基督活出來的生命。這也是接下來一整年要一點一點操練的。\n\n反覆，就是每天早晨提醒自己：「我是被三一神的愛所愛的人。」繁殖，就是把這週學到的，用自己的話告訴一個人。可以是你的小組組員、孩子、室友，或一位慕道的朋友。告訴他：「我們不是為孤單而造的，我們是為愛而造的。」","light":"改變觀念就改變生命。這週的新觀念是：關係的源頭是三一神。八大步驟中的「繁殖」，就是把領受傳下去；235的「2」提醒我們，信仰不是獨行的，要找一位同伴一起走。愛在傳遞中不會變少，反而越分越多。","think":["弗4:2-3中，保守合一需要哪些品格？","這週哪一個真理最觸動我？為甚麼？","我要把這週的領受分享給誰？甚麼時候？"],"speak":"天父，謝謝祢這一週帶我回到關係的源頭。求聖靈幫助我竭力保守合而為一的心，在家庭、教會和朋友之間活出謙虛、溫柔和忍耐。也求祢給我勇氣，把祢的愛告訴一個人。奉主耶穌的名禱告，阿們。","do":"今天約一位弟兄姊妹（見面或通話皆可），用三分鐘分享這週最觸動你的一句經文，並邀請他也分享，最後彼此代禱。","quick":"合一是聖靈所賜的，我們的責任是竭力保守。","rl":"以弗所書 4:1-6","text":[[4,1,"我為主被囚的勸你們：既然蒙召，行事為人就當與蒙召的恩相稱。"],[4,2,"凡事謙虛、溫柔、忍耐，用愛心互相寬容，"],[4,3,"用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。"],[4,4,"身體只有一個，聖靈只有一個，正如你們蒙召同有一個指望。"],[4,5,"一主，一信，一洗，"],[4,6,"一神，就是眾人的父，超乎眾人之上，貫乎眾人之中，也住在眾人之內。"]]}],"kl":"約翰福音 17:21","keyText":"使他們都合而為一。正如你父在我裏面，我在你裏面，使他們也在我們裏面，叫世人可以信你差了我來。"};
var CACHE = {};

function getJSON(names, ok, fail) {
var i = 0;
function next(lastErr) {
if (i >= names.length) return fail && fail(lastErr);
var url = names[i++] + '?v=' + APPVER;
var x = new XMLHttpRequest();
x.open('GET', url, true);
x.timeout = 20000;
x.onload = function () {
if (x.status >= 200 && x.status < 300 || (x.status === 0 && x.responseText)) {
try { return ok(JSON.parse(x.responseText)); } catch (e) { return next(url + ' JSON'); }
}
next(url + ' HTTP ' + x.status);
};
x.onerror = x.ontimeout = function () { next(url + ' ' + T('netErr')); };
x.send();
}
next('');
}

var m = {};
for (var i = 0; i < j.weeks.length; i++) m[j.weeks[i].w] = j.weeks[i];
CACHE[k] = m; cb(m);
}, function (err) { cb(null, err); });
}
function getWeek(w, cb) {
if (w === 1 && L() === 'zh' && typeof W1 !== 'undefined' && !CACHE.zh1) return cb(W1);
loadStage(stageOf(w), function (m, err) { cb(m ? m[w] : null, err); });
}

function weekDone(w) { var n = 0; for (var d = 1; d <= 5; d++) if (S.done[lid(w, d)]) n++; return n; }
function totalDone() { var n = 0; each(S.done, function () { n++; }); return n; }
function stageComplete(s) { var st = STAGES[s - 1]; for (var w = st[1]; w <= st[2]; w++) if (weekDone(w) < 5) return false; return true; }
function level() { var n = 0; for (var s = 1; s <= 5; s++) { if (stageComplete(s)) n++; else break; } return n; }
function nextLesson() {
var p = PATHS[S.path] || PATHS.main;
for (var i = 0; i < p.length; i++) for (var d = 1; d <= 5; d++) if (!S.done[lid(p[i], d)]) return { w: p[i], d: d, idx: i };
return null;
}
function pathProgress(id) { var p = PATHS[id], n = 0; for (var i = 0; i < p.length; i++) n += weekDone(p[i]); return [n, p.length * 5]; }

zh: [['yunjhe', 'zh-TW-YunJheNeural'], ['yunfan', 'zh-CN-Yunfan:DragonHDLatestNeural'], ['xiaochen', 'zh-CN-Xiaochen:DragonHDLatestNeural']],
zs: [['yunfan', 'zh-CN-Yunfan:DragonHDLatestNeural'], ['xiaochen', 'zh-CN-Xiaochen:DragonHDLatestNeural'], ['yunjhe', 'zh-TW-YunJheNeural']],
en: [['andrew', 'en-US-Andrew:DragonHDLatestNeural'], ['ava', 'en-US-Ava:DragonHDLatestNeural']]
};
function voiceName() { var vs = VOICES[L()], k = S.set.voice; for (var i = 0; i < vs.length; i++) if (vs[i][0] === k) return vs[i][1]; return vs[0][1]; }
function rateAttr() { return (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%'; }
function cnNum(n) {
n = parseInt(n, 10); var d = '零一二三四五六七八九';
if (n < 10) return d.charAt(n);
if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
if (n < 200) return '一百' + (n % 100 ? (n % 100 < 10 ? '零' : '') + cnNum(n % 100) : '');
return String(n);
}
function sanitize(t) {
t = String(t || '').replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ');
if (L() === 'en') return t.replace(/\s{2,}/g, ' ').trim();
t = t.replace(/[《》「」『』【】“”]/g, '');
t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, function (m, a, b, c) { return cnNum(a) + (L() === 'zs' ? '章' : '章') + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節'; });
t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
return t.replace(/[：]/g, '，').replace(/\s{2,}/g, ' ').trim();
}
function ttsChunks(t) {
t = sanitize(t); if (!t) return [];
var out = [], buf = '', stops = L() === 'en' ? '.!?;\n' : '。！？；\n', min = L() === 'en' ? 220 : 110;
for (var i = 0; i < t.length; i++) { var ch = t.charAt(i); buf += ch; if (stops.indexOf(ch) >= 0 && buf.length >= min) { out.push(buf); buf = ''; } }
if (buf.replace(/\s/g, '')) out.push(buf);
var fin = [], lim = L() === 'en' ? 600 : 300;
for (var j = 0; j < out.length; j++) { var s = out[j]; while (s.length > lim) { fin.push(s.slice(0, lim)); s = s.slice(lim); } if (s) fin.push(s); }
return fin;
}

}
function speak(text, title) {
stopSpeak();
var chunks = ttsChunks(text); if (!chunks.length) return;
